<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briga de Rua — Crônicas de Ravenhold</title>
    <meta name="description" content="RPG medieval de turnos no navegador: escolha sua classe, explore o reino, cumpra missões e derrote o Lorde Sombrio.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Briga de Rua</h1>
        <ul>
            <li><a href="#" id="beginning">Início</a></li>
            <li><a href="https://github.com/Swed0Z/Fight" target="_blank" rel="noopener">Sobre o Jogo</a></li>
            <li><a href="#" id="btnMute" role="button" aria-pressed="true">🔊 Som ligado</a></li>
            <li><a href="https://www.linkedin.com/in/felipe-lopes-93b70a2a2/" target="_blank" rel="noopener">Contato</a></li>
        </ul>
    </header>

    <main>
        <!-- Título -->
        <section id="title" class="screen active">
            <div class="hero-title">
                <p class="kicker">Crônicas de Ravenhold</p>
                <h2>Briga de Rua</h2>
                <div id="titleStep1" class="menu-col">
                    <button class="btn big" id="btnPlay">Jogar</button>
                </div>
                <div id="titleStep2" class="menu-col hidden">
                    <button class="btn big" id="btnContinue">Continuar</button>
                    <button class="btn big" id="btnNew">Novo Jogo</button>
                </div>
            </div>
        </section>

        <!-- Criação de personagem -->
        <section id="create" class="screen">
            <form id="createForm" class="create">
                <h2>Forje seu herói</h2>
                <label for="nameInput">Nome do personagem</label>
                <input type="text" id="nameInput" maxlength="16" autocomplete="off" placeholder="Ex.: Aldren">
                <div id="classCards" class="classCards"></div>
                <div class="acts">
                    <button type="button" class="btn" id="btnBack">Voltar</button>
                    <button type="submit" class="btn gold">Começar aventura</button>
                </div>
            </form>
        </section>

        <!-- Mapa -->
        <section id="hub" class="screen"></section>

        <!-- Batalha -->
        <section id="battle" class="screen"></section>

        <!-- Final -->
        <section id="ending" class="screen">
            <div class="hero-title">
                <p class="kicker">Vitória</p>
                <h2>O reino está salvo</h2>
                <p id="endText" class="endText"></p>
                <button class="btn big gold" id="btnKeep">Continuar explorando</button>
            </div>
        </section>
    </main>

    <div id="toasts" aria-live="polite"></div>

    <footer>
        <p class="footer">Feito por Felipe Lopes</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/rig.js"></script>
    <script src="js/audio.js"></script>
    <script type="module" src="js/pixelfx.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
